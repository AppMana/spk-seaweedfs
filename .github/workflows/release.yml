name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/test.yml

  publish-spk:
    needs: qualification
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DSM_QUALIFIED_SPK_SHA256: ${{ vars.DSM_QUALIFIED_SPK_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synology-spk-x64-7.2
          path: spksrc/packages
      - name: Require matching tag and DSM-qualified artifact
        id: spk
        run: |
          spk=$(python3 tests/package_artifact.py --tag "$GITHUB_REF_NAME" --path-only)
          actual=$(sha256sum "$spk" | cut -d ' ' -f 1)
          if [[ ! "$DSM_QUALIFIED_SPK_SHA256" =~ ^[0-9a-f]{64}$ ]] || [[ "$actual" != "$DSM_QUALIFIED_SPK_SHA256" ]]; then
            echo '::error::This exact SPK has not been qualified in the isolated DSM lifecycle lab. Publication is blocked.'
            exit 1
          fi
          echo "path=$spk" >> "$GITHUB_OUTPUT"
      - name: Upload the qualified bytes without rebuilding
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.spk.outputs.path }}
            ${{ steps.spk.outputs.path }}.sha256
            spksrc/packages/artifact-manifest.json
          fail_on_unmatched_files: true
