# SeaweedFS Synology volume server configuration.
#
# Single source of truth for `weed volume` argv. The DSM wizard's
# service_postinst hook writes this file by substituting @PLACEHOLDERS@.
# Editing this file via SSH is fully supported; the wizard reuses the
# same shape on upgrade. After any edit, run:
#
#     sudo synopkg restart seaweedfs
#
# to re-render argv (kube discovery + mTLS) and restart the daemon.

kube:
  apiserver: @APISERVER@
  tokenFile: @PKGVAR@/kube/token
  caFile: @PKGVAR@/kube/ca.crt
  insecureSkipTLSVerify: @INSECURE@
  namespace: @NAMESPACE@
  # seaweedName expects a seaweedfs-operator Seaweed CR. If your cluster
  # runs a plain Helm-chart SeaweedFS (no operator installed — this is
  # how AppMana's own production cluster runs it), delete seaweedName
  # and set kube.masterService to the master's Service name instead;
  # discovery then reads that Service's Endpoints directly, no CRD
  # needed. masterService wins if both are set.
  seaweedName: @SEAWEED_NAME@
  # masterService: seaweedfs-master
  # masterPort: 9333

volume:
  dir: @SHARE_PATH@
  ip: @ADVERTISE_IP@
  publicUrl: @ADVERTISE_IP@:@HTTP_PORT@
  port: @HTTP_PORT@
  grpcPort: @GRPC_PORT@
  dataCenter: @DATACENTER@
  rack: @RACK@
  max: @MAX_VOLUMES@
  diskType: @DISK_TYPE@
  index: ""
  extraFlags: []
  # Number of weed volume processes (all in this rack). Replication
  # policies with a same-rack copy count (e.g. "011") require >=2
  # processes for this NAS's rack to be eligible for volume growth at
  # all. Instance i serves port+i / grpcPort+i from <dir>/v<i>; with
  # instances > 1, publicUrl is derived per instance and the value
  # above is ignored. max applies PER INSTANCE.
  instances: 1

mtls:
  secretName: @MTLS_SECRET@

# Optional: source the weed binary from an OCI image instead of the one
# packaged in the SPK. The bootstrap pulls the image (anonymously),
# extracts the listed binaries, and caches them by digest under
# cacheDir. Clear image and restart to revert to the packaged binary.
weed:
  image: "@WEED_IMAGE@"
  digest: ""
  plainHTTP: @WEED_PLAIN_HTTP@
  binaries: []          # default: [/usr/bin/weed]
  cacheDir: @PKGVAR@/oci
