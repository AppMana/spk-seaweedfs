---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synology-volume-server
  namespace: seaweedfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synology-volume-server
  namespace: seaweedfs
rules:
  - apiGroups: ["seaweed.seaweedfs.com"]
    resources: ["seaweeds"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: []
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synology-volume-server
  namespace: seaweedfs
subjects:
  - kind: ServiceAccount
    name: synology-volume-server
    namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synology-volume-server
